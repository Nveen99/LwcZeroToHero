<template>
    <lightning-card title="Child to Parent Component - Child"
        icon-name="custom:custom11">
        <lightning-layout multiple-rows>

            <lightning-layout-item padding="around-small">
                <lightning-button variant="brand" label="Addition"
                    onclick={handleClickAddition} icon-name="utility:add"
                    icon-position="right">
                </lightning-button>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small">
                <lightning-button variant="brand" label="Subtraction"
                    onclick={handleClickSubtraction} icon-name="utility:dash"
                    icon-position="right">
                </lightning-button>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small">
                <lightning-button variant="brand" label="Multiple * 2"
                    onclick={handleClickMul}>
                </lightning-button>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small">
                <lightning-button variant="brand"
                    label="Multiple * 3 Datafactor" data-factor="3"
                    onclick={handleClickMultiply}>
                </lightning-button>
            </lightning-layout-item>

            <lightning-card title="Child to Parent Component - for each">
                <lightning-layout-item padding="around-small">
                    <template for:each={array} for:item="a">
                        <lightning-button variant="brand" key={a}
                            label={a} data-factor={a}
                            onclick={handleClickMultiply}
                            icon-name="utility:close"
                            icon-position="left">
                        </lightning-button>
                    </template>
                </lightning-layout-item>
            </lightning-card>

            <lightning-card title="Child to Parent Component - Sub Child">
                <lightning-layout-item padding="around-small"
                    onbuttonclickevent={handleSubChildMultiply}>

                    <template for:each={array} for:item="a">
                        <c-c2p-sub-child
                            key={a}
                            label={a}
                            icon="utility:close">
                        </c-c2p-sub-child>
                    </template>

                </lightning-layout-item>
            </lightning-card>
        </lightning-layout>

    </lightning-card>
</template>
