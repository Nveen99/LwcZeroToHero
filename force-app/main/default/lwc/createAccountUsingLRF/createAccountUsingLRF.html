<template>
    <lightning-card title="Account Creation using LRF"
        icon-name="standard:account">

        <lightning-record-form
            fields={fields}
            object-api-name="Account"
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            onerror={handleError}>
        </lightning-record-form>

        <template if:true={showSuccessMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_success"
                role="alert">
                <lightning-icon icon-name="utility:success"
                    size="x-small"></lightning-icon>
                <span class="slds-m-left_small">
                    Account created successfully!
                </span>
            </div>
        </template>

        <template if:true={showErrorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error"
                role="alert">
                <lightning-icon icon-name="utility:error"
                    size="x-small"></lightning-icon>
                <span class="slds-m-left_small">
                    {errorMessage}
                </span>
            </div>
        </template>

    </lightning-card>
</template>
