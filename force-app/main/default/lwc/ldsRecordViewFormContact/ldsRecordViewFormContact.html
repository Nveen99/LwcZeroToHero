<template>
    <lightning-card title="LDS Record view form - Dynamic"
        icon-name="standard:contact">

        <lightning-record-view-form
            object-api-name={objectApiName}
            record-id={recordId}>
            <div class="slds-grid">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-output-field
                        field-name={lastName}></lightning-output-field>
                    <lightning-output-field
                        field-name={firstName}></lightning-output-field>
                    <lightning-output-field
                        field-name={department}></lightning-output-field>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-output-field
                        field-name={phone}></lightning-output-field>
                    <lightning-output-field
                        field-name={email}></lightning-output-field>

                </div>
            </div>
        </lightning-record-view-form>
    </lightning-card>
</template>
